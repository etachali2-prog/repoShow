<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MELBA Technical Department - Sheet Data</title>

    <!-- SheetJS CDN for Exporting Table Data to Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-image:
                linear-gradient(
                    rgba(4, 18, 45, 0.65),
                    rgba(0, 35, 75, 0.75)
                ),
                url("https://th.bing.com/th/id/R.d87217d7ce2bd7b22f035551b9776d6c?rik=E6dE0qyzfKSe9g&pid=ImgRaw&r=0");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            color: white;
        }

        /* Top navigation bar */
        .navbar {
            width: 100%;
            min-height: 85px;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(5, 20, 45, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .logo span {
            color: #54d6ff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-link {
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 12px 25px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s ease;
        }

        .home-link {
            background: rgba(255, 255, 255, 0.08);
        }

        .forms-link {
            background: linear-gradient(135deg, #008cff, #00c6ff);
            border-color: transparent;
            box-shadow: 0 5px 20px rgba(0, 170, 255, 0.3);
        }

        .nav-link:hover {
            transform: translateY(-4px);
            background: white;
            color: #06366a;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* Container Section */
        .container {
            flex: 1;
            width: 96%;
            max-width: 1500px;
            margin: 30px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .container h1 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #54d6ff;
            text-align: center;
        }

        /* Controls Toolbar (Search + Buttons) */
        .controls-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            outline: none;
        }

        .search-box input::placeholder {
            color: #b0d4ff;
        }

        .btn {
            padding: 12px 22px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s ease;
            white-space: nowrap;
        }

        .print-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow: 0 5px 20px rgba(0, 114, 255, 0.3);
        }

        .excel-btn {
            background: linear-gradient(135deg, #1d976c, #93f9b9);
            color: #042512;
            box-shadow: 0 5px 20px rgba(29, 151, 108, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Table Wrapper with spreadsheet-like viewport */
        .table-wrapper {
            max-height: 70vh;
            overflow-y: auto;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 10, 25, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* Ensures strict cell sizing and wrapping like Google Sheets */
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            
            /* Google Sheets-like wrapping style */
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            vertical-align: top;
        }

        /* Spreadsheet Column Width Allocations */
        th:nth-child(1), td:nth-child(1) { width: 130px; } /* Date */
        th:nth-child(2), td:nth-child(2) { width: 140px; } /* Department */
        th:nth-child(3), td:nth-child(3) { width: 130px; } /* RequestedBy */
        th:nth-child(4), td:nth-child(4) { width: 120px; } /* RequestedTime */
        th:nth-child(5), td:nth-child(5) { width: 150px; } /* MachineName */
        th:nth-child(6), td:nth-child(6) { width: 120px; } /* Location */
        th:nth-child(7), td:nth-child(7) { width: 140px; } /* MaintenanceType */
        th:nth-child(8), td:nth-child(8) { width: 240px; } /* ProblemDescription (Wrapped) */
        th:nth-child(9), td:nth-child(9) { width: 110px; } /* PriorityLevel */
        th:nth-child(10), td:nth-child(10) { width: 240px; } /* MaintenanceActivity (Wrapped) */
        th:nth-child(11), td:nth-child(11) { width: 150px; } /* AssignedTechnician */
        th:nth-child(12), td:nth-child(12) { width: 130px; } /* TimeActionTaken */
        th:nth-child(13), td:nth-child(13) { width: 130px; } /* WorkStartTime */
        th:nth-child(14), td:nth-child(14) { width: 130px; } /* WorkCompletionTime */
        th:nth-child(15), td:nth-child(15) { width: 130px; } /* DowntimeDuration */
        th:nth-child(16), td:nth-child(16) { width: 160px; } /* SpareItemName */
        th:nth-child(17), td:nth-child(17) { width: 130px; } /* SparePartNo */
        th:nth-child(18), td:nth-child(18) { width: 100px; } /* SpareUnit */
        th:nth-child(19), td:nth-child(19) { width: 110px; } /* SpareQuantity */
        th:nth-child(20), td:nth-child(20) { width: 180px; } /* SpareRemark */
        th:nth-child(21), td:nth-child(21) { width: 140px; } /* MaintenanceStatus */
        th:nth-child(22), td:nth-child(22) { width: 180px; } /* PendingReason */
        th:nth-child(23), td:nth-child(23) { width: 150px; } /* SupervisorName */
        th:nth-child(24), td:nth-child(24) { width: 170px; } /* TechnicTeamLeaderName */

        th {
            position: sticky;
            top: 0;
            background-color: #041838;
            color: #83e5ff;
            font-size: 12px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            z-index: 2;
            border-bottom: 2px solid #54d6ff;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        td {
            font-size: 13px;
            color: #e4efff;
        }

        .status-msg {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #83e5ff;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px 15px;
            background: rgba(5, 20, 45, 0.75);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            color: #d5e6fa;
            font-size: 13px;
        }

        footer span {
            color: #54d6ff;
            font-weight: bold;
        }

        /* =================== A4 COMPACT PRINT STYLING =================== */
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }

            body {
                background: white !important;
                color: black !important;
            }

            .navbar, .controls-bar, footer, .status-msg {
                display: none !important;
            }

            .container {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                border: none !important;
                box-shadow: none !important;
                backdrop-filter: none !important;
            }

            .container h1 {
                color: #000 !important;
                font-size: 14px !important;
                margin-bottom: 8px !important;
                text-align: left !important;
            }

            .table-wrapper {
                max-height: none !important;
                overflow: visible !important;
                border: none !important;
                background: white !important;
            }

            table {
                width: 100% !important;
                table-layout: auto !important;
                border-collapse: collapse !important;
            }

            th, td {
                border: 1px solid #333 !important;
                padding: 4px 5px !important;
                font-size: 7.5px !important;
                color: black !important;
                width: auto !important;
            }

            th {
                background-color: #dcdcdc !important;
                color: black !important;
                font-weight: bold;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            tr {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">
            MELBA <span>TECHNICAL</span>
        </div>

        <nav class="nav-links">
            <a class="nav-link home-link" href="https://etachali2-prog.github.io/To-home/">HOME</a>
            <a class="nav-link forms-link" href="https://etachali2-prog.github.io/all/">FORMS ↗</a>
        </nav>
    </header>

    <!-- Main Content Table Container -->
    <main class="container">
        <h1>Maintenance & Technical Records</h1>

        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search records..." onkeyup="filterTable()">
            </div>
            <button class="btn print-btn" onclick="window.print()">🖨️ Print A4 Report</button>
            <button class="btn excel-btn" onclick="exportToExcel()">📊 Export Excel (.xlsx)</button>
        </div>

        <div id="statusMsg" class="status-msg">Loading data ...</div>

        <div class="table-wrapper">
            <table id="dataTable" style="display: none;">
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        © 2026 <span>MELBA PRINTING PUBLISHING & PACKAGING S.C.</span> | Technical Department
    </footer>

    <script>
        // Google Apps Script Web App URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzJ1qUxUl_vROSz4gaHqqzqiIrPVZLSe6TErJusxM2eNC8FpK9AN49_2msecSG2oPXEA/exec";

        async function fetchSheetData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                if (data.length === 0) {
                    document.getElementById('statusMsg').innerText = "No records found in the sheet.";
                    return;
                }

                // Hide loading status, show table
                document.getElementById('statusMsg').style.display = 'none';
                document.getElementById('dataTable').style.display = 'table';

                // Render Table Headers
                const tableHeader = document.getElementById('tableHeader');
                const headers = Object.keys(data[0]);
                headers.forEach(header => {
                    const th = document.createElement('th');
                    th.innerText = header;
                    tableHeader.appendChild(th);
                });

                // Helper function to convert UTC timestamps to Local Date & Time
                function formatLocalDateTime(value) {
                    if (typeof value === 'string' && value.match(/^\d{4}-\d{2}-\d{2}T/)) {
                        const date = new Date(value);
                        if (!isNaN(date.getTime())) {
                            const year = date.getFullYear();
                            const month = String(date.getMonth() + 1).padStart(2, '0');
                            const day = String(date.getDate()).padStart(2, '0');
                            const hours = String(date.getHours()).padStart(2, '0');
                            const minutes = String(date.getMinutes()).padStart(2, '0');
                            return `${year}-${month}-${day} ${hours}:${minutes}`;
                        }
                    }
                    return value !== undefined ? value : '';
                }

                // Render Table Body
                const tableBody = document.getElementById('tableBody');
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    headers.forEach(header => {
                        const td = document.createElement('td');
                        if (header.toLowerCase().includes('date') || header.toLowerCase().includes('time')) {
                            td.innerText = formatLocalDateTime(row[header]);
                        } else {
                            td.innerText = row[header] !== undefined ? row[header] : '';
                        }
                        tr.appendChild(td);
                    });
                    tableBody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('statusMsg').innerText = "Failed to load sheet data. Please check your Web App URL.";
            }
        }

        function filterTable() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');

            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        }

        // Export active HTML table to Excel (.xlsx) file
        function exportToExcel() {
            const table = document.getElementById("dataTable");
            if (!table || table.style.display === "none") {
                alert("No table data available to export.");
                return;
            }
            const wb = XLSX.utils.table_to_book(table, { sheet: "Maintenance Records" });
            XLSX.writeFile(wb, "MELBA_Maintenance_Records.xlsx");
        }

        // Fetch data on page load
        window.onload = fetchSheetData;
    </script>
</body>
</html>
